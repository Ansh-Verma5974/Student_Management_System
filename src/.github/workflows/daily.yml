name: Daily Contribution

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "Ansh Verma"
          git config user.email "anshverma5974@gmail.com"

      - name: Make daily contribution
        run: |
          echo "Last updated: $(date -u)" > daily.txt
          git add daily.txt
          git commit -m "Daily contribution" || exit 0
          git push
